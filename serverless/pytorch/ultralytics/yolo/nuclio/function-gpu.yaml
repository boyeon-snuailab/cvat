# Template for custom Ultralytics YOLO detect / pose models (YOLOv8 / YOLO11).
# deploy.sh fills in the function name and the label spec from the weights file.
metadata:
  name: ultralytics-yolo
  namespace: cvat
  annotations:
    name: Ultralytics YOLO
    type: detector
    spec: |
      []

spec:
  description: Custom Ultralytics YOLO object detector
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  env:
    - name: YOLO_WEIGHTS
      value: /opt/nuclio/weights/model.pt
    - name: YOLO_KEYPOINTS_LABEL
      value: Point

  build:
    image: cvat.ultralytics.yolo:latest-gpu
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: ENV
          value: YOLO_CONFIG_DIR=/tmp/ultralytics
        - kind: RUN
          value: apt-get update && apt-get -y install git python3 python3-pip python-is-python3 libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip3 install --no-cache-dir torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cu126
        - kind: RUN
          value: pip3 install --no-cache-dir --upgrade pip && pip3 install --no-cache-dir "numpy<2" ultralytics==8.4.113 pyyaml

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 268435456 # 256MB, CVAT sends whole high-resolution frames
  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
