metadata:
  name: pth-facebookresearch-sam3-interactor
  namespace: cvat
  annotations:
    name: Segment Anything 3
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box_optional: true
    help_message: The interactor allows to get a mask of an object using a bounding box and/or positive and negative points

spec:
  description: Interactive object segmentation with Segment Anything 3
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 300s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam3
    - name: SAM3_CHECKPOINT
      value: /opt/nuclio/weights/sam3.pt

  build:
    image: cvat.pth.facebookresearch.sam3.interactor:latest-gpu
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: WORKDIR
          value: /opt/nuclio/sam3
        - kind: RUN
          value: apt-get update && apt-get -y install git python3 python3-pip python-is-python3 libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip3 install --no-cache-dir torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cu126
        - kind: RUN
          value: pip3 install --no-cache-dir "numpy<2" "setuptools<80" opencv-python-headless pycocotools scipy einops psutil matplotlib pyyaml
        - kind: RUN
          value: pip3 install --no-cache-dir --upgrade pip && pip3 install --no-cache-dir git+https://github.com/facebookresearch/sam3.git@7f473cf

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 268435456 # 256MB, CVAT sends whole high-resolution frames
  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
